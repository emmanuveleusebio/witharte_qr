<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Destination...</title>
  <meta http-equiv="refresh" content="0; url=https://www.google.com/search?q=WITHARTE+Gallery">
  <script>
    window.location.replace("https://www.google.com/search?q=WITHARTE+Gallery");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Redirecting you securely to your link...</p>
  <p><small>If you are not redirected automatically, <a href="https://www.google.com/search?q=WITHARTE+Gallery">click here</a>.</small></p>
</body>
</html>
